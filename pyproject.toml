[project]
name = "agenten-verstaerkungslernen"
version = "1.0.0"
description = "Agent Reinforcement Learning — Q-Learning, DQN & Policy Gradient mit W&B + OpenPipe"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "wandb>=0.15.0",
    "openpipe>=5.0.0",
    "torch>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
